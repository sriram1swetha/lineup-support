<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ConnectDaDots · Game Maker (prototype)</title>
<style>
  :root { --bg:#0f1320; --card:#191e2e; --ink:#e8ecf5; --mut:#9aa3b8; --accent:#e94560; --line:#2a3145; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--mut); font-size:13px; }
  .wrap { display:grid; grid-template-columns: 320px 1fr; gap:16px; padding:16px 20px; align-items:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  label { display:block; margin:10px 0 4px; font-size:13px; color:var(--mut); }
  input[type=text], select { width:100%; padding:8px; background:#10141f; color:var(--ink); border:1px solid var(--line); border-radius:8px; }
  input[type=range] { width:100%; }
  .row { display:flex; gap:8px; align-items:center; }
  .row .val { min-width:38px; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; }
  button { width:100%; padding:11px; margin-top:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.secondary { background:#2a3145; }
  canvas { background:#0b0e16; border:1px solid var(--line); border-radius:10px; max-width:100%; image-rendering:auto; }
  .stats { color:var(--mut); font-size:13px; margin-top:8px; }
  textarea { width:100%; height:220px; margin-top:10px; background:#10141f; color:#cfe3ff; border:1px solid var(--line); border-radius:8px; padding:10px; font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .checks { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; color:var(--mut); font-size:13px; }
  .checks label { display:inline-flex; align-items:center; gap:6px; margin:0; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#2a3145; color:var(--mut); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>ConnectDaDots · Game Maker <span class="pill">prototype</span></h1>
  <p>Upload a clean icon / emoji-style image → auto-detect dots &amp; segments → export the app's template JSON. Tune the sliders; the red overlay shows what you'd get.</p>
</header>

<div class="wrap">
  <!-- ── controls ── -->
  <div class="card">
    <h2>Source</h2>
    <input type="file" id="file" accept="image/*" />
    <label>Or load a known game (tests the renderer)</label>
    <select id="sample"><option value="">— none —</option></select>

    <h2 style="margin-top:18px">Detection</h2>
    <label>Simplify (RDP) — fewer dots ▸ <span id="rdpV">2.5</span></label>
    <input type="range" id="rdp" min="0.5" max="8" step="0.1" value="2.5" />
    <label>Straightness — line vs curve ▸ <span id="lineV">1.6</span></label>
    <input type="range" id="line" min="0.4" max="6" step="0.1" value="1.6" />
    <label>Junction snap (px) ▸ <span id="snapV">5</span></label>
    <input type="range" id="snap" min="0" max="16" step="1" value="5" />
    <div class="checks">
      <label><input type="checkbox" id="dbgEdges" /> edges</label>
      <label><input type="checkbox" id="dbgSkel" checked /> skeleton</label>
      <label><input type="checkbox" id="showNums" checked /> dot #</label>
    </div>

    <h2 style="margin-top:18px">Metadata</h2>
    <label>Name</label><input type="text" id="name" value="Untitled" />
    <label>Game mode</label>
    <select id="mode"><option value="easy">easy</option><option value="surprise">surprise</option></select>

    <button id="detect">Detect dots &amp; segments</button>
    <button id="download" class="secondary">Download JSON</button>
  </div>

  <!-- ── output ── -->
  <div class="card">
    <h2>Preview <span id="stats" class="stats"></span></h2>
    <canvas id="cv" width="480" height="480"></canvas>
    <textarea id="json" spellcheck="false" placeholder="Template JSON appears here…"></textarea>
  </div>
</div>

<script src="detector.js"></script>
<script src="render.js"></script>
<script src="samples.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  let imgData = null, imgEl = null, lastResult = null;

  // sample dropdown
  Object.keys(window.SAMPLES || {}).forEach(k => {
    const o = document.createElement('option'); o.value = k; o.textContent = k; $('sample').appendChild(o);
  });

  // live slider labels
  const sync = () => { $('rdpV').textContent = $('rdp').value; $('lineV').textContent = $('line').value; $('snapV').textContent = $('snap').value; };
  ['rdp','line','snap'].forEach(id => $(id).addEventListener('input', () => { sync(); if (imgData) run(); }));
  ['dbgEdges','dbgSkel','showNums'].forEach(id => $(id).addEventListener('change', () => { if (imgData) run(); else drawSample(); }));
  sync();

  // ── image load ──
  $('file').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    $('sample').value = '';
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      const max = 480, sc = Math.min(1, max / Math.max(im.width, im.height));
      const W = Math.max(2, Math.round(im.width * sc)), H = Math.max(2, Math.round(im.height * sc));
      cv.width = W; cv.height = H;
      ctx.clearRect(0,0,W,H); ctx.drawImage(im, 0, 0, W, H);
      imgData = ctx.getImageData(0, 0, W, H); imgEl = im;
      URL.revokeObjectURL(url);
      run();
    };
    im.src = url;
  });

  // ── sample render (validate renderer, no detection) ──
  $('sample').addEventListener('change', () => { const k = $('sample').value; if (k) { imgData = null; drawSample(); } });
  function drawSample() {
    const tpl = window.SAMPLES[$('sample').value]; if (!tpl) return;
    cv.width = 480; cv.height = 480; ctx.clearRect(0,0,480,480);
    window.Renderer.render(ctx, tpl, 480, 480, { numbers: $('showNums').checked });
    $('json').value = JSON.stringify(tpl, null, 2); lastResult = { template: tpl };
    $('stats').textContent = `sample · ${tpl.unitDots.length} dots · ${tpl.bezierSegments.length} segments`;
  }

  // ── run detection ──
  function run() {
    if (!imgData) return;
    const W = imgData.width, H = imgData.height;
    const res = window.Detector.detect(imgData, {
      rdpEps: +$('rdp').value, lineTol: +$('line').value, snapTol: +$('snap').value,
      name: $('name').value, gameMode: $('mode').value,
    });
    lastResult = res;
    // base: faded image
    ctx.clearRect(0,0,W,H);
    if (imgEl) { ctx.globalAlpha = 0.35; ctx.drawImage(imgEl, 0, 0, W, H); ctx.globalAlpha = 1; }
    // debug masks
    if ($('dbgEdges').checked) { window.Renderer.renderMask(overlayCtx(W,H), res.debug.edges, W, H, [80,90,120]); blit(); }
    if ($('dbgSkel').checked)  { window.Renderer.renderMask(overlayCtx(W,H), res.debug.skeleton, W, H, [120,200,120]); blit(); }
    // result overlay
    window.Renderer.render(ctx, res.template, W, H, { numbers: $('showNums').checked, dotRadius: 5, lineWidth: 2 });
    $('json').value = JSON.stringify(res.template, null, 2);
    const s = res.stats;
    $('stats').textContent = `${s.dots} dots · ${s.segments} segments · ${s.strokes} strokes · ${s.junctions} junctions`;
  }
  // tiny offscreen helper to blit a mask with transparency over the image
  let _oc = null;
  function overlayCtx(W,H){ if(!_oc){_oc=document.createElement('canvas');} _oc.width=W; _oc.height=H; return _oc.getContext('2d'); }
  function blit(){ ctx.drawImage(_oc, 0, 0); }

  $('detect').addEventListener('click', run);
  $('download').addEventListener('click', () => {
    if (!lastResult) return;
    const blob = new Blob([JSON.stringify(lastResult.template, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (lastResult.template.name || 'game').replace(/\s+/g,'_') + '.json';
    a.click(); URL.revokeObjectURL(a.href);
  });
})();
</script>
</body>
</html>
